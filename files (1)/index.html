<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panda Bambu — Jogo de Matemática</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- MENU -->
  <div id="menu" class="card">
    <h1>🐼 Panda Bambu 🎋</h1>
    <p class="sub">O panda está com fome! Acerte as contas para ele chegar ao bambu.</p>
    <div class="menu-btns">
      <button class="op" data-op="+"><span>➕</span>Adição</button>
      <button class="op" data-op="-"><span>➖</span>Subtração</button>
      <button class="op" data-op="*"><span>✖️</span>Multiplicação</button>
      <button class="op" data-op="/"><span>➗</span>Divisão</button>
      <button class="op wide" data-op="mix"><span>🎲</span>Misto</button>
    </div>
    <p class="center" id="best"></p>
  </div>

  <!-- JOGO -->
  <div id="game" class="hide">
    <div class="card">
      <div class="hud">
        <span class="pill" id="lvl">Nível 1</span>
        <span class="pill" id="score">⭐ 0</span>
        <span class="pill" id="streak">🔥 0</span>
        <span class="pill" id="lives">❤️❤️❤️</span>
      </div>
      <div class="bar"><i id="prog"></i></div>
    </div>
    <div class="card">
      <div class="scene" id="scene">
        <span id="panda">🐼</span>
        <span id="goal">🎋</span>
      </div>
      <div class="q" id="question">…</div>
      <div class="ans" id="answers"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="center"><button class="link" id="quit">Voltar ao menu</button></div>
  </div>

  <!-- FIM DE JOGO -->
  <div id="end" class="card center hide">
    <div class="big" id="endEmoji">🏆</div>
    <h1 id="endTitle"></h1>
    <p id="endText" class="sub"></p>
    <button class="primary" id="again">Jogar de novo</button>
    <p><button class="link" id="toMenu">Escolher outra operação</button></p>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
